<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多应用壳层预览 · app-shell-multi</title>
  <link rel="stylesheet" href="../kits/ob-static/tokens.css" />
  <link rel="stylesheet" href="../kits/ob-static/components.css" />
</head>
<body>
  <div class="ob-app ob-app--multi">
    <header class="ob-topnav">
      <div class="ob-topnav__brand">
        <span class="ob-sider__brand-mark">OB</span>
        <span>OceanBase 云平台</span>
      </div>
      <nav class="ob-topnav__apps" aria-label="应用">
        <a class="ob-topnav__item is-active" href="shell-multi-preview.html">运维中心</a>
        <a class="ob-topnav__item" href="#order">订单中心</a>
        <a class="ob-topnav__item" href="#billing">计费中心</a>
        <a class="ob-topnav__item" href="#iam">访问控制</a>
      </nav>
      <div class="ob-topnav__right">
        <span class="ob-avatar" title="管理员">管</span>
      </div>
    </header>
    <div class="ob-layout">
      <aside class="ob-sider">
        <ul class="ob-menu">
          <li class="ob-menu__group is-open">
            <button type="button" class="ob-menu__group-title" aria-expanded="true">
              <span>资源管理</span>
              <span class="ob-menu__group-caret" aria-hidden="true"></span>
            </button>
            <ul class="ob-menu__sub">
              <li class="ob-menu__item is-active"><a href="shell-multi-preview.html"><span>租户列表</span></a></li>
              <li class="ob-menu__item"><a href="cluster-overview.html"><span>集群概览</span></a></li>
            </ul>
          </li>
          <li class="ob-menu__group">
            <button type="button" class="ob-menu__group-title" aria-expanded="false">
              <span>数据保护</span>
              <span class="ob-menu__group-caret" aria-hidden="true"></span>
            </button>
            <ul class="ob-menu__sub">
              <li class="ob-menu__item"><a href="backup-policy-form.html"><span>备份策略</span></a></li>
            </ul>
          </li>
        </ul>
      </aside>
      <div class="ob-main">
        <header class="ob-header">
          <nav class="ob-page-tabs" aria-label="已打开页面"></nav>
        </header>
        <main class="ob-content">
          <div class="ob-page-title">
            <div>
              <h1>租户列表</h1>
            </div>
            <div class="ob-page-title__actions">
              <button type="button" class="ob-btn ob-btn--primary">新建租户</button>
            </div>
          </div>

          <div class="ob-stack">
            <section class="ob-card">
              <div class="ob-card__body">
                <p style="margin:0;color:var(--ob-color-text-navigation);font:var(--ob-font-body1)">
                  这是 <code>app-shell-multi</code> 预览：顶栏为同级应用（L1），左侧为当前「运维中心」内导航（L2），右侧为业务内容。
                  点击顶栏其他应用可看切换态（本页仅示意，不跳转完整应用包）。
                </p>
              </div>
            </section>

            <section class="ob-card">
              <div class="ob-card__body">
                <div class="ob-filter">
                  <div class="ob-filter-item">
                    <button type="button" class="ob-filter-trigger">
                      <span>状态</span>
                      <span class="ob-filter-trigger__caret"></span>
                    </button>
                  </div>
                  <input class="ob-input" placeholder="搜索租户名称" style="max-width:240px" />
                  <button type="button" class="ob-btn ob-btn--default">查询</button>
                </div>
              </div>
            </section>

            <section class="ob-card">
              <div class="ob-card__body ob-card__body--flush">
                <table class="ob-table">
                  <thead>
                    <tr>
                      <th>租户名称</th>
                      <th>模式</th>
                      <th>状态</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>pay_core</td>
                      <td>MySQL</td>
                      <td><span class="ob-tag ob-tag--success">运行中</span></td>
                      <td class="ob-table__actions"><a class="ob-link" href="tenant-detail.html">详情</a></td>
                    </tr>
                    <tr>
                      <td>oms_meta</td>
                      <td>Oracle</td>
                      <td><span class="ob-tag">已停用</span></td>
                      <td class="ob-table__actions"><a class="ob-link" href="tenant-detail.html">详情</a></td>
                    </tr>
                    <tr>
                      <td>analytics_dw</td>
                      <td>MySQL</td>
                      <td><span class="ob-tag ob-tag--success">运行中</span></td>
                      <td class="ob-table__actions"><a class="ob-link" href="tenant-detail.html">详情</a></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>
  <script src="../kits/ob-static/controls.js"></script>
  <script>
    document.querySelectorAll('.ob-topnav__item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (el.getAttribute('href') === 'shell-multi-preview.html') return;
        e.preventDefault();
        document.querySelectorAll('.ob-topnav__item').forEach(function (x) {
          x.classList.remove('is-active');
        });
        el.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
